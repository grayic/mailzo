    <path d="M0 640 L120 590 L210 612 L330 560 L430 600 L560 575 L700 610 L860 570 L980 600 L1120 556 L1260 596 L1440 560 L1440 900 L0 900Z" fill="#b5b6d6" opacity=".7"/>
