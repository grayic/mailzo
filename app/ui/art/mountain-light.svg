<svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="l-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9db4ec"/><stop offset=".42" stop-color="#d9dcf4"/>
        <stop offset=".62" stop-color="#f4dcdf"/><stop offset=".8" stop-color="#f6c0b2"/><stop offset="1" stop-color="#f1ad9f"/>
      </linearGradient>
      <linearGradient id="l-lit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe6ec"/><stop offset="1" stop-color="#e9c3d3"/></linearGradient>
      <linearGradient id="l-shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9cfe6"/><stop offset="1" stop-color="#9ea7c9"/></linearGradient>
      <linearGradient id="l-rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f7699"/><stop offset="1" stop-color="#4b5174"/></linearGradient>
      <linearGradient id="l-r1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6088"/><stop offset="1" stop-color="#3d4266"/></linearGradient>
      <linearGradient id="l-r2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#454b72"/><stop offset="1" stop-color="#2c3052"/></linearGradient>
      <linearGradient id="l-r3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#363b5f"/><stop offset="1" stop-color="#22253f"/></linearGradient>
      <linearGradient id="l-haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c8c2" stop-opacity="0"/><stop offset="1" stop-color="#f3c8c2" stop-opacity=".55"/></linearGradient>
    </defs>
    <rect width="1440" height="900" fill="url(#l-sky)"/>
