    <path d="M722 352 L705 368 L640 430 L560 500 L600 506 L540 590 L640 548 L610 640 L700 560 L735 470 Z" fill="url(#l-shade)"/>
    <path d="M722 352 L760 384 L860 470 L1010 560 L1110 615 L1020 612 L1060 650 L930 610 L880 640 L840 560 L760 520 L735 470 Z" fill="url(#l-lit)"/>
    <path d="M722 352 L735 470 L760 520 L790 470 Z" fill="#f7d7e0"/>
    <path d="M640 548 L700 560 L735 470 L700 600 Z" fill="#8f97bb" opacity=".6"/>
    <path d="M840 560 L880 640 L930 610 L900 690 Z" fill="#7d84a8" opacity=".55"/>
