[package]
name = "fakeoauth"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Stands in for a provider's sign-in pages in tests and the demo. Never used in the shipped app."

[dependencies]
axum = "0.8"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "rt"] }
