[package]
name = "fakeimap"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tiny in-process IMAP server for tests and the demo mailbox. Never used in the shipped app."

[dependencies]
data-encoding = "2"
tokio = { version = "1", features = ["net", "io-util", "rt", "sync"] }

[dev-dependencies]
tokio = "1"
